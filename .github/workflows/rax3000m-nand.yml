name: RAX3000M NAND Firmware

on:
  workflow_dispatch:
  push:
    tags:
      - 'rax3000m-nand-build-*'

permissions:
  contents: read

concurrency:
  group: rax3000m-nand-firmware

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PROFILE: configs/rax3000m-nand
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out build configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get -qq update
          sudo apt-get -qq install --no-install-recommends \
            build-essential bison clang flex g++-multilib gawk gcc-multilib gettext git \
            libelf-dev libncurses-dev libssl-dev lld python3-dev python3-pyelftools \
            python3-setuptools rsync swig unzip xsltproc zlib1g-dev
          df -h "$GITHUB_WORKSPACE"

      - name: Prepare pinned LEDE and verify configuration
        run: |
          bash "$PROFILE/prepare.sh" "$RUNNER_TEMP/lede"
          cp "$PROFILE/.config" "$RUNNER_TEMP/lede/.config"
          make -C "$RUNNER_TEMP/lede" defconfig
          bash "$PROFILE/check-packages.sh" config "$RUNNER_TEMP/lede/.config"

      - name: Download build dependencies
        run: make -C "$RUNNER_TEMP/lede" download -j8

      - name: Compile firmware
        run: |
          make -C "$RUNNER_TEMP/lede" -j"$(nproc)" || make -C "$RUNNER_TEMP/lede" -j1 V=s

      - name: Verify and collect NAND firmware
        run: |
          out="$RUNNER_TEMP/lede/bin/targets/mediatek/filogic"
          shopt -s nullglob
          factory=("$out"/*-cmcc_rax3000m-nand-*-factory.bin)
          sysupgrade=("$out"/*-cmcc_rax3000m-nand-*-sysupgrade.bin)
          manifests=("$out"/*-cmcc_rax3000m-nand.manifest)
          if [[ ${#manifests[@]} == 0 ]]; then
            manifests=("$out"/*-mediatek-filogic.manifest)
          fi
          if [[ ${#factory[@]} != 1 || ${#sysupgrade[@]} != 1 || ${#manifests[@]} != 1 ]]; then
            echo 'Expected one NAND factory image, sysupgrade image and manifest.' >&2
            ls -la "$out"
            exit 1
          fi
          [[ -s ${factory[0]} && -s ${sysupgrade[0]} ]]
          test "$(stat -c %s "${factory[0]}")" -le "$((116736 * 1024))"
          bash "$PROFILE/check-packages.sh" manifest "${manifests[0]}"
          mkdir -p firmware
          cp "${factory[0]}" "${sysupgrade[0]}" "${manifests[0]}" "$PROFILE/sources.lock" firmware/
          cp "$RUNNER_TEMP/lede/.config" firmware/build.config
          cd firmware
          sha256sum ./*.bin > sha256sums

      - name: Upload NAND firmware
        uses: actions/upload-artifact@v4
        with:
          name: rax3000m-nand-${{ github.run_id }}
          path: firmware/
          if-no-files-found: error
          compression-level: 0
